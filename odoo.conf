[options]
# Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo

# Addons path
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Server
http_port = 8069
longpolling_port = 8072

# Logging
log_level = debug
log_handler = :INFO

# Workers (for production, set to > 0)
workers = 0

# Limits
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

# Dev mode
dev_mode = reload,qweb,werkzeug,xml

# Admin password (change in production!)
admin_passwd = admin

# Without demo data
without_demo = False

# List databases
list_db = True
